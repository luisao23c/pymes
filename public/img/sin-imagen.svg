<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f6f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede9e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3c5e;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#4a7a9c;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="300" fill="url(#bg)" rx="0"/>
  
  <!-- Subtle pattern -->
  <circle cx="250" cy="50" r="80" fill="url(#accent)" opacity="0.3"/>
  <circle cx="50" cy="250" r="60" fill="url(#accent)" opacity="0.2"/>
  
  <!-- Image icon -->
  <g transform="translate(150,130)" text-anchor="middle">
    <!-- Camera body -->
    <rect x="-35" y="-20" width="70" height="50" rx="8" fill="none" stroke="#1a3c5e" stroke-width="2.5" opacity="0.35"/>
    <!-- Lens -->
    <circle cx="0" cy="5" r="14" fill="none" stroke="#1a3c5e" stroke-width="2.5" opacity="0.35"/>
    <circle cx="0" cy="5" r="6" fill="#1a3c5e" opacity="0.12"/>
    <!-- Flash -->
    <rect x="-12" y="-28" width="24" height="10" rx="3" fill="none" stroke="#1a3c5e" stroke-width="2" opacity="0.25"/>
  </g>
  
  <!-- Text -->
  <text x="150" y="200" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#1a3c5e" opacity="0.4">Sin imagen</text>
  
  <!-- Bottom accent line -->
  <rect x="110" y="215" width="80" height="2" rx="1" fill="#1a3c5e" opacity="0.12"/>
</svg>
