<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1efe9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2ddd2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3c5e;stop-opacity:0.22" />
      <stop offset="100%" style="stop-color:#4a7a9c;stop-opacity:0.10" />
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="300" height="300" fill="url(#bg)" rx="0"/>

  <!-- Círculos decorativos -->
  <circle cx="252" cy="48" r="86" fill="url(#accent)"/>
  <circle cx="42" cy="256" r="64" fill="url(#accent)"/>

  <!-- Tarjeta del icono -->
  <rect x="92" y="82" width="116" height="96" rx="18" fill="#ffffff" opacity="0.85"/>
  <rect x="92" y="82" width="116" height="96" rx="18" fill="none" stroke="#1a3c5e" stroke-width="2" opacity="0.14"/>

  <!-- Icono de imagen / montaña y sol -->
  <g transform="translate(150,130)" text-anchor="middle">
    <rect x="-34" y="-22" width="68" height="48" rx="9" fill="none" stroke="#1a3c5e" stroke-width="2.6" opacity="0.4"/>
    <circle cx="-14" cy="-10" r="5" fill="#1a3c5e" opacity="0.45"/>
    <path d="M-26 16 L-8 -2 L4 10 L14 2 L26 16 Z" fill="#1a3c5e" opacity="0.28"/>
    <rect x="-14" y="-32" width="28" height="9" rx="3" fill="none" stroke="#1a3c5e" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Texto -->
  <text x="150" y="206" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="700" fill="#1a3c5e" opacity="0.55" letter-spacing="0.02em">Sin imagen</text>

  <!-- Línea inferior -->
  <rect x="118" y="218" width="64" height="2.5" rx="1.25" fill="#1a3c5e" opacity="0.18"/>
</svg>